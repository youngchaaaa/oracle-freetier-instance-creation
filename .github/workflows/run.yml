      - name: Oracle Free Tier Instance Creation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install oci requests paramiko python-dotenv

      # 줄바꿈과 특수문자가 깨지지 않도록 안전하게 파일 생성
      - name: Setup OCI Config File
        run: |
          cat << 'EOF' > oci_config
          ${{ secrets.OCI_CONFIG }}
          EOF

          cat << 'EOF' > oci_api_key.pem
          ${{ secrets.OCI_KEY_FILE }}
          EOF

          chmod 600 oci_api_key.pem

      - name: Run creation script
        env:
          OCPUS: ${{ secrets.OCPUS }}
          MEMORY_IN_GBS: ${{ secrets.MEMORY_IN_GBS }}
          DISPLAY_NAME: ${{ secrets.DISPLAY_NAME }}
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
